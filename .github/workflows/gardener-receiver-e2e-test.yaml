name: Gardener Receiver E2E Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'receiver/gardenerreceiver/**'
      - '.github/workflows/gardener-receiver-e2e-test.yaml'
  workflow_dispatch:
    inputs:
      gardener_ref:
        description: |
          gardener/gardener git ref to test against. Defaults to the version
          pinned in receiver/gardenerreceiver/go.mod.
        default: ""
        type: string

permissions:
  contents: read

jobs:
  gardener-receiver-e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout collector
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      # To keep the tested Gardener version in lock-step with the Gardener module
      # we compile against, this step reads the matching git ref out of go.mod
      # so no separate pin needs to be maintained. A manual gardener_ref dispatch
      # input overrides it.
      - name: Resolve gardener ref
        id: gardener-ref
        working-directory: receiver/gardenerreceiver
        run: |
          ref="${{ github.event.inputs.gardener_ref }}"
          if [[ -z "${ref}" ]]; then
            ref=$( go mod edit -json | jq -r '.Require[] | select(.Path == "github.com/gardener/gardener") | .Version' )
          fi
          if [[ -z "${ref}" ]]; then
            echo "could not determine gardener/gardener version from go.mod" >&2
            exit 1
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
          echo "Testing against gardener/gardener ${ref}"

      - name: Checkout gardener
        uses: actions/checkout@v7
        with:
          repository: gardener/gardener
          ref: ${{ steps.gardener-ref.outputs.ref }}
          path: gardener

      - name: Install dnsmasq
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsmasq
          sudo systemctl disable --now dnsmasq || true

      - name: Run Gardener Recevier e2e test
        env:
          CI: ""
          GARDENER_DIR: ${{ github.workspace }}/gardener
        run: sudo -E env "PATH=$PATH" make -C receiver/gardenerreceiver test-e2e
